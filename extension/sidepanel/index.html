<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Angel Agent</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>ANGEL AGENT</h1><p>네이버 블로그 입력 도우미</p>
  <p id="connection" role="status">연결되지 않음</p>
  <div id="connectionSettings" hidden>
    <label>Angel Agent 주소<input id="baseUrl" type="url" value="http://localhost:3000"></label>
    <label>연결 토큰<input id="token" type="password" autocomplete="off" placeholder="ANGEL_EXTENSION_TOKEN"></label>
    <button id="connect">연결 저장</button>
    <button id="cancelSettings">취소</button>
  </div>
  <div id="connectionActions" hidden>
    <button id="refreshTasks">목록 새로고침</button>
    <button id="changeSettings">연결 설정 변경</button>
  </div>
  <label>Blog Task<select id="tasks"><option value="">작업을 선택하세요</option></select></label>
  <h2 id="title">선택한 글 없음</h2><p id="images">이미지 0개 · 첫 사진만 자동 삽입</p>
  <button id="diagnose">현재 글쓰기 DOM 진단</button><pre id="diagnostic"></pre>
  <button id="insert" disabled>현재 글쓰기 화면에 넣기</button>
  <p id="result" role="status"></p>
  <p class="note">현재 열린 네이버 글쓰기 탭을 사용합니다. 첫 사진만 자동 삽입하며 나머지 사진과 최종 발행은 직접 진행하세요.</p>
  <script src="../clipboard.js"></script><script src="index.js"></script>
</body>
</html>
